<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포컬랩 관리자</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ink:#211D19; --paper:#F0EEE9; --ink-soft:#6E665B; --card:#FAF8F3;
    --focus-blue:#2A5DAA; --focus-blue-deep:#1F4783; --gold:#B9893B; --carrot:#D35F2B;
    --line:#E1DCD1; --danger:#B3402A; --ok:#3E7A4E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  }
  header{
    position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; background:rgba(240,238,233,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  header .brand{font-weight:800; letter-spacing:-.02em; font-size:18px;}
  header .brand span{color:var(--carrot);}
  header .who{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft);}
  header .who b{color:var(--ink);}
  .btn{
    cursor:pointer; border:none; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600;
    background:var(--ink); color:#fff; transition:background .15s ease;
  }
  .btn:hover{background:var(--focus-blue-deep);}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn.ghost:hover{background:#fff;}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#8f3220;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  main{max-width:1080px; margin:0 auto; padding:28px 20px 60px;}

  /* ---------- 로그인 화면 ---------- */
  #loginScreen{
    min-height:calc(100vh - 60px); display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    width:100%; max-width:360px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:32px 28px; box-shadow:0 8px 28px rgba(33,29,25,.06);
  }
  .login-card h1{font-size:20px; margin:0 0 4px;}
  .login-card p{font-size:13px; color:var(--ink-soft); margin:0 0 22px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px;
    background:#fff; color:var(--ink); font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--focus-blue); outline-offset:1px;}
  .error-msg{
    background:#FBEAE6; color:var(--danger); font-size:13px; padding:10px 12px; border-radius:8px;
    margin-bottom:14px; display:none;
  }
  .error-msg.show{display:block;}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:16px; line-height:1.6;}

  /* ---------- 대시보드 ---------- */
  #dashboard{display:none;}
  .tabs{display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  .tab-btn{
    background:none; border:none; padding:10px 16px; font-size:14px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab-btn.active{color:var(--ink); border-bottom-color:var(--carrot);}
  .panel{display:none;}
  .panel.active{display:block;}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;}
  .toolbar input[type=search]{
    flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px;
  }
  .count-badge{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  thead th{
    text-align:left; font-size:12px; color:var(--ink-soft); padding:10px 12px; background:#EDE9DF;
    border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; user-select:none;
  }
  thead th:hover{color:var(--ink);}
  tbody td{padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBF9F4;}
  .type-badge{
    display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700;
  }
  .type-순위진단{background:#E5EDF8; color:var(--focus-blue-deep);}
  .type-자가진단{background:#F3E9D6; color:var(--gold);}
  .type-일반상담{background:#EEEBE4; color:var(--ink-soft);}
  .detail-cell{max-width:280px; color:var(--ink-soft); font-size:12px;}
  select.status-select{
    padding:5px 8px; border-radius:6px; border:1px solid var(--line); font-size:12px; background:#fff;
  }
  .empty-state, .loading-state{padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:14px;}

  .admin-grid{display:grid; grid-template-columns:1fr; gap:20px;}
  @media (min-width:760px){ .admin-grid{grid-template-columns:1.3fr 1fr;} }
  .card-box{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px;}
  .card-box h3{margin:0 0 14px; font-size:14px;}
  .admin-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; gap:8px; flex-wrap:wrap;}
  .admin-row:last-child{border-bottom:none;}
  .role-pill{font-size:11px; padding:2px 8px; border-radius:999px; background:#EEEBE4; color:var(--ink-soft); font-weight:700;}
  .role-pill.super{background:#F3E9D6; color:var(--gold);}
  .muted{color:var(--ink-soft); font-size:12px;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:50;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="brand">FOCAL<span>LAB</span> 관리자</div>
  <div class="who" id="whoBox" style="display:none;">
    <span>안녕하세요, <b id="whoName"></b>님 <span class="role-pill" id="whoRole"></span></span>
    <button class="btn ghost" id="logoutBtn">로그아웃</button>
  </div>
</header>

<!-- ===================== 로그인 화면 ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <h1>관리자 로그인</h1>
    <p>포컬랩 상담 신청 관리 페이지입니다.</p>
    <div class="error-msg" id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label>아이디</label>
        <input type="text" id="loginUsername" autocomplete="username" required>
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" style="width:100%;" id="loginSubmitBtn">로그인</button>
    </form>
    <p class="hint">계정 문의는 슈퍼관리자에게 요청하세요.</p>
  </div>
</div>

<!-- ===================== 대시보드 ===================== -->
<main id="dashboard">
  <div class="tabs">
    <button class="tab-btn active" data-tab="inquiries">문의 신청자 목록</button>
    <button class="tab-btn" data-tab="admins" id="adminsTabBtn" style="display:none;">관리자 계정 관리</button>
  </div>

  <!-- 문의 목록 패널 -->
  <section class="panel active" id="panel-inquiries">
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="이름 또는 전화번호 검색">
      <button class="btn ghost" id="refreshBtn">새로고침</button>
      <span class="count-badge" id="countBadge"></span>
    </div>
    <div id="inquiriesWrap">
      <div class="loading-state">불러오는 중…</div>
    </div>
  </section>

  <!-- 관리자 계정 관리 패널 -->
  <section class="panel" id="panel-admins">
    <div class="admin-grid">
      <div class="card-box">
        <h3>관리자 계정 목록</h3>
        <div id="adminListWrap"><div class="loading-state">불러오는 중…</div></div>
      </div>
      <div class="card-box">
        <h3>관리자 계정 추가</h3>
        <div class="error-msg" id="addAdminError"></div>
        <form id="addAdminForm">
          <div class="field">
            <label>아이디</label>
            <input type="text" id="newAdminUsername" required>
          </div>
          <div class="field">
            <label>비밀번호 (8자 이상)</label>
            <input type="password" id="newAdminPassword" minlength="8" required>
          </div>
          <div class="field">
            <label>등급</label>
            <select id="newAdminRole">
              <option value="admin">일반관리자</option>
              <option value="super_admin">슈퍼관리자</option>
            </select>
          </div>
          <button class="btn" type="submit" style="width:100%;">계정 추가</button>
        </form>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
 * 설정: 진단 서버(API_BASE) 주소. 인수인계 메모 기준 api.focallab.co.kr
 * ========================================================================= */
const API_BASE = 'https://api.focallab.co.kr';

const el = (id) => document.getElementById(id);
let session = null; // { token, username, role }
let inquiriesCache = [];
let sortState = { key: 'timestamp', dir: 'desc' };

function showToast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function saveSession(s){
  session = s;
  sessionStorage.setItem('focallab_admin_session', JSON.stringify(s));
}
function loadSession(){
  try { return JSON.parse(sessionStorage.getItem('focallab_admin_session')); }
  catch(e){ return null; }
}
function clearSession(){
  session = null;
  sessionStorage.removeItem('focallab_admin_session');
}

async function api(path, opts = {}){
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (session && session.token) headers['Authorization'] = 'Bearer ' + session.token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  let json;
  try { json = await res.json(); } catch(e) { json = { success:false, error:'서버 응답 오류' }; }
  if (res.status === 401) {
    clearSession();
    showLogin('세션이 만료되었습니다. 다시 로그인해주세요.');
    throw new Error(json.error || '인증 만료');
  }
  if (!json.success) throw new Error(json.error || '요청 실패');
  return json;
}

/* ---------------- 화면 전환 ---------------- */
function showLogin(message){
  el('loginScreen').style.display = 'flex';
  el('dashboard').style.display = 'none';
  el('whoBox').style.display = 'none';
  if (message) {
    el('loginError').textContent = message;
    el('loginError').classList.add('show');
  }
}
function showDashboard(){
  el('loginScreen').style.display = 'none';
  el('dashboard').style.display = 'block';
  el('whoBox').style.display = 'flex';
  el('whoName').textContent = session.username;
  el('whoRole').textContent = session.role === 'super_admin' ? '슈퍼관리자' : '일반관리자';
  el('whoRole').classList.toggle('super', session.role === 'super_admin');
  el('adminsTabBtn').style.display = session.role === 'super_admin' ? 'inline-block' : 'none';
  loadInquiries();
}

/* ---------------- 로그인 ---------------- */
el('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  el('loginError').classList.remove('show');
  const username = el('loginUsername').value.trim();
  const password = el('loginPassword').value;
  const btn = el('loginSubmitBtn');
  btn.disabled = true; btn.textContent = '로그인 중…';
  try {
    const res = await fetch(API_BASE + '/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '로그인 실패');
    saveSession({ token: json.token, username: json.username, role: json.role });
    showDashboard();
  } catch (err) {
    el('loginError').textContent = err.message;
    el('loginError').classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = '로그인';
  }
});

el('logoutBtn').addEventListener('click', () => {
  clearSession();
  showLogin();
  el('loginUsername').value = '';
  el('loginPassword').value = '';
});

/* ---------------- 탭 전환 ---------------- */
document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
    btn.classList.add('active');
    el('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'admins') loadAdmins();
  });
});

/* ---------------- 문의 신청자 목록 ---------------- */
async function loadInquiries(){
  el('inquiriesWrap').innerHTML = '<div class="loading-state">불러오는 중…</div>';
  try {
    const json = await api('/admin/inquiries');
    inquiriesCache = json.rows || [];
    renderInquiries();
  } catch (err) {
    el('inquiriesWrap').innerHTML = '<div class="empty-state">불러오기 실패: ' + escapeHtml(err.message) + '</div>';
  }
}

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderInquiries(){
  const q = el('searchInput').value.trim().toLowerCase();
  let rows = inquiriesCache.filter((r) =>
    !q || r.name.toLowerCase().includes(q) || String(r.phone).replace(/-/g,'').includes(q.replace(/-/g,'')));

  rows = rows.slice().sort((a, b) => {
    let av = a[sortState.key], bv = b[sortState.key];
    av = (av || '').toString(); bv = (bv || '').toString();
    const cmp = av.localeCompare(bv);
    return sortState.dir === 'asc' ? cmp : -cmp;
  });

  el('countBadge').textContent = `총 ${inquiriesCache.length}건 중 ${rows.length}건 표시`;

  if (!rows.length) {
    el('inquiriesWrap').innerHTML = '<div class="empty-state">표시할 문의가 없습니다.</div>';
    return;
  }

  const statusOptions = ['신규', '연락중', '연락완료', '보류'];
  const html = `
    <table>
      <thead>
        <tr>
          <th data-key="timestamp">신청일시 ${sortArrow('timestamp')}</th>
          <th data-key="name">이름 ${sortArrow('name')}</th>
          <th>전화</th>
          <th data-key="type">유형 ${sortArrow('type')}</th>
          <th>진단정보</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((r) => `
          <tr>
            <td>${escapeHtml(fmtDate(r.timestamp))}</td>
            <td>${escapeHtml(r.name)}</td>
            <td>${escapeHtml(r.phone)}</td>
            <td><span class="type-badge type-${escapeHtml(r.type)}">${escapeHtml(r.type)}</span></td>
            <td class="detail-cell">${escapeHtml(r.detail) || '-'}</td>
            <td>
              <select class="status-select" data-key="${encodeURIComponent(r.key)}">
                ${statusOptions.map((s) => `<option value="${s}" ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  el('inquiriesWrap').innerHTML = html;

  document.querySelectorAll('th[data-key]').forEach((th) => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortState.key === key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      else { sortState.key = key; sortState.dir = 'asc'; }
      renderInquiries();
    });
  });
  document.querySelectorAll('.status-select').forEach((sel) => {
    sel.addEventListener('change', async () => {
      const key = decodeURIComponent(sel.dataset.key);
      const status = sel.value;
      try {
        await api('/admin/inquiry-status', { method: 'POST', body: JSON.stringify({ key, status }) });
        const row = inquiriesCache.find((r) => r.key === key);
        if (row) row.status = status;
        showToast('상태가 저장되었습니다');
      } catch (err) {
        showToast('저장 실패: ' + err.message);
      }
    });
  });
}
function sortArrow(key){
  if (sortState.key !== key) return '';
  return sortState.dir === 'asc' ? '▲' : '▼';
}

el('searchInput').addEventListener('input', renderInquiries);
el('refreshBtn').addEventListener('click', loadInquiries);

/* ---------------- 관리자 계정 관리 (슈퍼관리자 전용) ---------------- */
async function loadAdmins(){
  if (session.role !== 'super_admin') return;
  el('adminListWrap').innerHTML = '<div class="loading-state">불러오는 중…</div>';
  try {
    const json = await api('/admin/admins');
    renderAdmins(json.admins || []);
  } catch (err) {
    el('adminListWrap').innerHTML = '<div class="empty-state">불러오기 실패: ' + escapeHtml(err.message) + '</div>';
  }
}

function renderAdmins(admins){
  if (!admins.length) {
    el('adminListWrap').innerHTML = '<div class="empty-state">계정이 없습니다.</div>';
    return;
  }
  el('adminListWrap').innerHTML = admins.map((a) => `
    <div class="admin-row">
      <div>
        <b>${escapeHtml(a.username)}</b>
        <span class="role-pill ${a.role === 'super_admin' ? 'super' : ''}">${a.role === 'super_admin' ? '슈퍼관리자' : '일반관리자'}</span>
        ${a.username === session.username ? '<span class="muted">(나)</span>' : ''}
      </div>
      <div style="display:flex; gap:6px;">
        ${a.username !== session.username ? `
          <button class="btn ghost" data-action="toggle-role" data-username="${escapeHtml(a.username)}" data-role="${a.role}">
            ${a.role === 'super_admin' ? '일반관리자로 변경' : '슈퍼관리자로 변경'}
          </button>
          <button class="btn danger" data-action="delete" data-username="${escapeHtml(a.username)}">삭제</button>
        ` : '<span class="muted">본인 계정</span>'}
      </div>
    </div>
  `).join('');

  el('adminListWrap').querySelectorAll('[data-action="toggle-role"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const username = btn.dataset.username;
      const newRole = btn.dataset.role === 'super_admin' ? 'admin' : 'super_admin';
      try {
        await api('/admin/admins/' + encodeURIComponent(username), { method: 'PATCH', body: JSON.stringify({ role: newRole }) });
        showToast('등급이 변경되었습니다');
        loadAdmins();
      } catch (err) { showToast('변경 실패: ' + err.message); }
    });
  });
  el('adminListWrap').querySelectorAll('[data-action="delete"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const username = btn.dataset.username;
      if (!confirm(`'${username}' 계정을 삭제할까요?`)) return;
      try {
        await api('/admin/admins/' + encodeURIComponent(username), { method: 'DELETE' });
        showToast('계정이 삭제되었습니다');
        loadAdmins();
      } catch (err) { showToast('삭제 실패: ' + err.message); }
    });
  });
}

el('addAdminForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  el('addAdminError').classList.remove('show');
  const username = el('newAdminUsername').value.trim();
  const password = el('newAdminPassword').value;
  const role = el('newAdminRole').value;
  try {
    await api('/admin/admins', { method: 'POST', body: JSON.stringify({ username, password, role }) });
    showToast('계정이 추가되었습니다');
    el('addAdminForm').reset();
    loadAdmins();
  } catch (err) {
    el('addAdminError').textContent = err.message;
    el('addAdminError').classList.add('show');
  }
});

/* ---------------- 시작: 저장된 세션 있으면 바로 대시보드 ---------------- */
(function init(){
  const saved = loadSession();
  if (saved && saved.token) {
    session = saved;
    showDashboard();
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
